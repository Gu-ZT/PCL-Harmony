name: Bug Report - Bug反馈
description: Create a report to help us improve. - 反馈问题，帮助我们改进
title: "[Bug] "
labels:
  - 🐛 Bug

body:
  - type: markdown
    attributes:
      value: |
        Before filling in this `issue`, please make sure that there are no similar or duplicate `issues` that have been opened.
        填写此 `issue` 前，请先确认已经开启的 `issue` 没有类似或重复的 `issue`。

  - type: input
    id: launcher_version
    attributes:
      label: Launcher Version - 启动器版本
      description: |
        Which Plain Craft Launcher version are you injecting into? The version is shown in the launcher title bar.
        你正在注入哪个版本的 Plain Craft Launcher？版本号显示在启动器标题栏中。
      placeholder: e.g. 2.99.0.0
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Loader Version - 加载器版本
      description: |
        Which PCL Harmony release are you using?
        你使用的是哪个 PCL Harmony 版本？
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: installed
    attributes:
      label: Loader Attached? - 加载器是否生效
      description: |
        If `PclHarmony.log` exists in the launcher folder, the loader attached. Check its first lines.
        如果启动器目录下存在 `PclHarmony.log`，说明加载器已生效。请查看其开头几行。
      options:
        - Log exists and the loader attached - 日志存在且加载器已生效
        - No log file at all - 完全没有日志文件
        - Log exists but plugin loading failed - 日志存在但插件加载失败
        - Not sure - 不确定
    validations:
      required: true

  - type: textarea
    id: exist
    attributes:
      label: Existing behavior - 现有行为
      description: |
        Please describe the problem carefully. Include the relevant excerpt from `PclHarmony.log` and, if present, the "运行环境错误" dialog text.
        请仔细描述问题。请附上 `PclHarmony.log` 的相关片段，以及「运行环境错误」窗口文本（若有）。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: Expected behavior - 预期行为
      description: |
        Please describe in detail the results you wish to achieve.
        请仔细描述你要得到的结果。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce - 复现问题
      description: |
        Which plugins were in `plugins\`, and how did you launch the launcher?
        `plugins\` 中有哪些插件？你是如何启动启动器的？
    validations:
      required: false

  - type: checkboxes
    id: know
    attributes:
      label: Checks - 检查项
      options:
        - label: I have searched the existing issues and confirmed that there is no identical issue. 我已经搜索已有 Issue 并且确认没有相同的 Issue。
          required: true
        - label: I admit that I previously checked all options without thorough verification and directly submitted this Issue, and I agree that it can be closed directly. 我承认此前未充分核实便勾选了所有选项并直接提交此 Issue，且同意该 Issue 可被直接关闭。
        - label: I confirm that I am using the latest release of PCL Harmony. If not, this issue can be closed directly. 我确认当前使用的是 PCL Harmony 的最新正式版，若非如此，此 Issue 可被直接关闭。
          required: true
        - label: I promise to provide a detailed description of the encountered issue, along with the relevant `PclHarmony.log` excerpt, rather than offering incomplete or vague information. 我承诺将详细描述遇到的问题，并提供相关 `PclHarmony.log` 片段，而非提供不完整或模糊的信息。
          required: true
