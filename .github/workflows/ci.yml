name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# The product version lives in project.json (repo root); nothing is hardcoded
# here. src/loader/PclHarmony.csproj must keep its AssemblyVersion in sync - the
# "Resolve version" step fails the build if the two disagree.

jobs:
  # ---------------------------------------------------------------- build ----
  build:
    name: Build loader and sample plugin
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # project.json in the repo root is the single source of truth for the
      # product version. Directory.Build.props feeds it into every project, so
      # there is nothing else to keep in sync.
      # Branch pushes produce a pre-release v<version>-dev.<run_number>;
      # v* tags produce a stable release v<version>. Same rule as the
      # reference dsh-launcher pipeline.
      #
      # The release pipeline also stamps the resolved version into the binaries
      # (see "Stamp build version") and bumps project.json after a stable
      # release (see the bump-version job), so a dev build carries its real
      # version and the next cycle starts one patch ahead.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $manifestPath = 'project.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "missing $manifestPath" }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $base = [string]$manifest.version
          if ([string]::IsNullOrWhiteSpace($base)) { throw "project.json has no version field" }
          Write-Host "project.json version = $base"

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag  = $env:GITHUB_REF_NAME
            $bare = $tag -replace '^v', ''
            if ($bare -ne $base) { throw "tag $tag does not match project.json version $base" }
            $version    = $bare
            $prerelease = if ($bare -match '-') { 'true' } else { 'false' }
          } else {
            $version    = "$base-dev.$env:GITHUB_RUN_NUMBER"
            $tag        = "v$version"
            $prerelease = 'true'
          }
          "version=$version"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"               | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$version prerelease=$prerelease tag=$tag"

      # Stamp the resolved version into the binaries. project.json holds the
      # plain product version ("1.0.0"); a branch build is really
      # "1.0.0-dev.<run>" and a tag build is the tag itself. Directory.Build.props
      # lets PCL_HARMONY_VERSION win over project.json, so the shipped DLL
      # reports the version it was actually built as instead of the manifest's.
      # Release builds pass the tag version verbatim, which equals the manifest.
      - name: Stamp build version
        shell: pwsh
        run: |
          "PCL_HARMONY_VERSION=${{ steps.version.outputs.version }}" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "stamping version ${{ steps.version.outputs.version }}"

      - name: Check release scripts parse
        shell: pwsh
        run: |
          # ci/*.ps1 run only on a stable release, i.e. rarely. A syntax error in
          # one of them would otherwise surface only on release day.
          $files = Get-ChildItem -Path 'ci' -Filter '*.ps1' -File -ErrorAction SilentlyContinue
          if (-not $files) { throw "no scripts found under ci/" }
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw "syntax error in $($f.Name): $($errors[0].Message)"
            }
            Write-Host "  ok: $($f.Name)"
          }

      - name: Build and stage dist
        shell: pwsh
        run: ./build.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          $expected = @(
            'dist/PclHarmony/PclHarmony.dll',
            'dist/PclHarmony/0Harmony.dll',
            'dist/plugins/Test.dll'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) { throw "missing build output: $file" }
            Write-Host ("{0,-38} {1,10} bytes" -f $file, (Get-Item -LiteralPath $file).Length)
          }

          # The binary must carry the STAMPED version, not the bare manifest one.
          # InformationalVersion keeps the full string incl. "-dev.<run>", so this
          # is the end-to-end proof that the version really reaches the artifact.
          $want = $env:PCL_HARMONY_VERSION
          if ([string]::IsNullOrWhiteSpace($want)) { throw "PCL_HARMONY_VERSION was not set" }

          $asm = [System.Reflection.AssemblyName]::GetAssemblyName(
                   (Resolve-Path 'dist/PclHarmony/PclHarmony.dll'))
          $core = ($want -split '-')[0]
          Write-Host "expected=$want  AssemblyVersion=$($asm.Version)  core=$core"
          if (-not $asm.Version.ToString().StartsWith("$core.")) {
            throw "version drift: expected core $core but PclHarmony.dll reports $($asm.Version)"
          }

          # InformationalVersion is where the pre-release suffix lives; read it
          # without loading the assembly (Assembly.LoadFrom would lock the file
          # and can pull in PCL types we do not want in this job).
          $info = $null
          try {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist/PclHarmony/PclHarmony.dll'))
            $full  = [System.Reflection.Assembly]::ReflectionOnlyLoad($bytes)
            $attr  = $full.GetCustomAttributesData() |
                       Where-Object { $_.AttributeType.Name -eq 'AssemblyInformationalVersionAttribute' } |
                       Select-Object -First 1
            if ($attr) { $info = $attr.ConstructorArguments[0].Value }
          } catch {
            Write-Host "could not read InformationalVersion: $($_.Exception.Message)"
          }
          Write-Host "InformationalVersion=$info"
          if ($info -and $info -ne $want -and -not $info.StartsWith("$want+")) {
            throw "InformationalVersion '$info' does not match stamped version '$want'"
          }
          Write-Host "stamped version verified: $want"

      # Assemble the distribution. The archive is FLAT at the top level:
      #   install.ps1  uninstall.ps1  README.md  README.en_US.md  LICENSE
      #   PclHarmony.dll  0Harmony.dll  plugins/Test.dll
      # so that unzipping it next to the launcher gives install.ps1 everything
      # it needs, and the two DLLs sit at the archive root as users expect.
      - name: Assemble distribution archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'pcl-harmony'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'plugins') | Out-Null

          $files = @(
            'install.ps1',
            'uninstall.ps1',
            'README.md',
            'README.en_US.md',
            'LICENSE'
          )
          foreach ($f in $files) {
            Copy-Item -LiteralPath $f -Destination $stage -Force
          }

          # Loader DLLs at the archive ROOT.
          Copy-Item -LiteralPath 'dist/PclHarmony/PclHarmony.dll' -Destination $stage -Force
          Copy-Item -LiteralPath 'dist/PclHarmony/0Harmony.dll'   -Destination $stage -Force
          Copy-Item -LiteralPath 'dist/plugins/Test.dll'          -Destination (Join-Path $stage 'plugins') -Force

          $zip = Join-Path $env:RUNNER_TEMP 'PCL-Harmony.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          Write-Host "archive: $zip ($((Get-Item -LiteralPath $zip).Length) bytes)"
          Get-ChildItem -Recurse -File $stage |
            ForEach-Object { "{0,-34} {1,10} bytes" -f $_.FullName.Substring($stage.Length + 1), $_.Length }

          # Assert the contract the installer depends on.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $arc = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = $arc.Entries | ForEach-Object { $_.FullName -replace '\\','/' }
            $required = @(
              'install.ps1','uninstall.ps1','PclHarmony.dll','0Harmony.dll',
              'README.md','README.en_US.md','LICENSE','plugins/Test.dll'
            )
            foreach ($r in $required) {
              if ($names -notcontains $r) { throw "archive is missing required entry at expected path: $r" }
            }
            Write-Host "archive layout verified: $($required -join ', ')"
          } finally { $arc.Dispose() }

          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCL-Harmony-${{ steps.version.outputs.version }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  # -------------------------------------------------------------- release ----
  # Runs on every push to main and on v* tags: branch pushes publish a
  # pre-release, tag pushes publish a stable release.
  release:
    name: Publish release
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # The manifest (project.json) is read from the repository, so this job
      # needs its own checkout - the build job's checkout is not shared.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distribution archive
        uses: actions/download-artifact@v4
        with:
          name: PCL-Harmony-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/dist

      # Builds the per-kind file list. Runs for every release (stable or pre) so
      # env.RELEASE_FILES is always set; the manifest/checksum files are only
      # produced for stable releases.
      - name: Prepare release assets
        shell: pwsh
        working-directory: ${{ runner.temp }}/dist
        run: |
          $zip = 'PCL-Harmony.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw "missing $zip" }

          $files = @($zip)

          if ('${{ needs.build.outputs.prerelease }}' -eq 'false') {
            # project.json is the release manifest: name, version, description.
            $src = Join-Path $env:GITHUB_WORKSPACE 'project.json'
            if (-not (Test-Path -LiteralPath $src)) { throw "missing project.json in workspace" }
            Copy-Item -LiteralPath $src -Destination 'project.json' -Force

            $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $zip | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii

            Write-Host "project.json:"
            Get-Content -LiteralPath 'project.json'
            Write-Host "SHA256SUMS.txt:"
            Get-Content -LiteralPath 'SHA256SUMS.txt'

            $files += 'project.json'
            $files += 'SHA256SUMS.txt'
          }

          # Absolute paths: the publish step runs from the workspace root.
          $abs = $files | ForEach-Object { Join-Path (Get-Location).Path $_ }
          Write-Host "release assets:`n$($abs -join "`n")"

          # Multi-line env var. Written WITHOUT a BOM: Out-File -Encoding utf8 in
          # PowerShell 7 prepends one, which makes the runner fail to recognise
          # the heredoc delimiter and silently drops the value.
          $lines = @("RELEASE_FILES<<__EOF__") + $abs + @("__EOF__")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV,
            (($lines -join "`n") + "`n"),
            (New-Object System.Text.UTF8Encoding($false)))

      # A single publish step. softprops/action-gh-release updates an existing
      # release rather than creating it; doing that from a SECOND invocation was
      # rejected with "Resource not accessible by integration" (the integration
      # token can create the release it was granted, but the follow-up update
      # path is not covered). Publishing once avoids the second call entirely.
      #
      # Stable releases also ship project.json + SHA256SUMS.txt (prepared above);
      # pre-releases only ship the archive. The file list is built in an earlier
      # step because it differs per release kind, and an empty entry in `files`
      # would trip fail_on_unmatched_files.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_FILES }}

  # ----------------------------------------------------------- bump version ---
  # After a STABLE release the manifest moves one patch ahead (1.0.0 -> 1.0.1)
  # so the next plain push does not keep rebuilding an already-shipped version.
  #
  # This runs as its own job, after the release is published, on purpose: the
  # release job attaches project.json to the stable release, and that attachment
  # must describe the version being released (1.0.0), not the bumped one. Bumping
  # before publishing would put 1.0.1 into the 1.0.0 release's manifest.
  #
  # Pre-releases never bump: dev/rc tags are cut from an unreleased version.
  bump-version:
    name: Bump manifest version
    needs: [build, release]
    if: github.event_name == 'push' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Must push the bump back to the branch the tag was cut from.
          ref: ${{ github.event.repository.default_branch }}
          # A token is required to push; the default GITHUB_TOKEN is fine because
          # we grant contents: write at workflow level.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump project.json to next patch
        shell: pwsh
        run: ./ci/bump-version.ps1 '${{ needs.build.outputs.tag }}'

      - name: Commit and push version bump
        shell: pwsh
        run: |
          $next = [string](Get-Content -LiteralPath 'project.json' -Raw | ConvertFrom-Json).version

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add project.json
          # git diff --cached --quiet exits 1 when there IS a staged change.
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "no version change to commit (already bumped)"
            exit 0
          }

          # No [skip ci]: the bump lands on the default branch and SHOULD produce
          # a fresh dev pre-release for the new version (1.0.1-dev.<run>). It
          # cannot loop - this job only runs for stable tag pushes, and the bump
          # commit is a plain branch push.
          git commit -m "chore(release): bump version to $next"
          git push

          Write-Host "pushed version bump to $next"
