name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build loader and sample plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and stage dist
        shell: pwsh
        run: ./build.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          $expected = @(
            'dist/PclHarmony/PclHarmony.dll',
            'dist/PclHarmony/0Harmony.dll',
            'dist/plugins/Test.dll'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "missing build output: $file"
            }
            $item = Get-Item -LiteralPath $file
            Write-Host ("{0,-38} {1,10} bytes" -f $file, $item.Length)
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcl-harmony-build
          path: |
            dist/PclHarmony/PclHarmony.dll
            dist/PclHarmony/0Harmony.dll
            dist/plugins/Test.dll
          if-no-files-found: error
